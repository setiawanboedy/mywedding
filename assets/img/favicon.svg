<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f722e"/>
      <stop offset="100%" stop-color="#6e4c19"/>
    </linearGradient>
    <style>
      .bg { fill: #fffdf4; }
      .ring-out { fill: none; stroke: #1f321d; stroke-width: 2.2; }
      .ring-in { fill: none; stroke: #8d6225; stroke-width: 1.2; }
      .letter-b {
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-size: 29px;
        font-weight: 700;
        fill: #1f321d;
      }
      .letter-w {
        font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-size: 26px;
        font-style: italic;
        font-weight: 600;
        fill: url(#gold-grad);
      }
    </style>
  </defs>
  <circle cx="32" cy="32" r="31" class="bg"/>
  <circle cx="32" cy="32" r="29" class="ring-out"/>
  <circle cx="32" cy="32" r="26" class="ring-in"/>
  <!-- Initial B (Groom) -->
  <text x="24" y="39" class="letter-b" text-anchor="middle">B</text>
  <!-- Initial W (Bride) -->
  <text x="39" y="44" class="letter-w" text-anchor="middle">W</text>
</svg>
