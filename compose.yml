services:
  app:
    build: .
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-3050}
      DATABASE_PATH: /app/data/undangan.sqlite
    ports:
      - "${APP_PORT:-3050}:${APP_PORT:-3050}"
    volumes:
      - invitation-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3050/api/health'); if (!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - universal  

volumes:
  invitation-data:

networks:
  universal:
    external: true
    name: universal